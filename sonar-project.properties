sonar.projectKey=kenzim_grokbot-client
sonar.projectName=grokbot-client
sonar.sourceEncoding=UTF-8

sonar.sources=grokbot
sonar.tests=tests

sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml

sonar.exclusions=**/__pycache__/**,grokbot/_proto/**
sonar.test.inclusions=tests/**
sonar.coverage.exclusions=tests/**,grokbot/_proto/**

# Do not set sonar.dependencyCheck.jsonReportPath. A missing path hangs
# Community 26.6, and importing CVEs fails the quality gate (new_violations=0).
