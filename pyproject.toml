[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grokbot-client"
version = "0.1.0"
description = "Unofficial async Python client for the Grok Bot cloud-agent backend (aiserver.v1, Connect-RPC)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "protobuf>=5.29,<6",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools==1.70.0",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["grokbot"]

[tool.hatch.build.targets.wheel.force-include]
"grokbot/py.typed" = "grokbot/py.typed"

[tool.hatch.build.targets.sdist]
include = [
    "/grokbot",
    "/proto",
    "/tests",
    "/tools",
    "/README.md",
    "/LICENSE",
    "/sonar-project.properties",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["grokbot", "tests"]
extend-exclude = ["grokbot/_proto"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: hits the production backend; requires GROKBOT_LIVE=1",
    "live_mutate: creates/sends on the production backend; requires GROKBOT_LIVE_MUTATE=1",
]

[tool.coverage.run]
source = ["grokbot"]
omit = ["grokbot/_proto/*"]
